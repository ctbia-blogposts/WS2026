<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img"><title>Inside one DDPM residual block</title><desc>Normalized and activated features pass through a convolution, receive a projected timestep embedding, and pass through normalization, activation, dropout, and a second convolution before a residual skip is added.</desc><rect width="1000" height="300" fill="white"/><g font-family="system-ui, sans-serif"><text x="27" y="155" font-size="20" text-anchor="middle" fill="#303030">h</text><rect x="85" y="120" width="215" height="65" fill="none" stroke="#aaa" stroke-width="1"/><text x="192.5" y="144" font-size="16" text-anchor="middle" fill="#303030">GroupNorm → Swish</text><text x="192.5" y="164" font-size="14" text-anchor="middle" fill="#303030">3 × 3 convolution</text><path d="M40 148 L85 148 M79.73 150.88 L85 148 L79.73 145.12" fill="none" stroke="#555" stroke-width="1.5"/><path d="M300 148 L342 148 M336.73 150.88 L342 148 L336.73 145.12" fill="none" stroke="#555" stroke-width="1.5"/><text x="355" y="156" font-size="25" text-anchor="middle" fill="#303030">+</text><rect x="415" y="110" width="260" height="85" fill="none" stroke="#aaa" stroke-width="1"/><text x="545.0" y="134" font-size="16" text-anchor="middle" fill="#303030">GroupNorm → Swish</text><text x="545.0" y="154" font-size="14" text-anchor="middle" fill="#303030">Dropout</text><text x="545.0" y="174" font-size="14" text-anchor="middle" fill="#303030">3 × 3 convolution</text><path d="M368 148 L415 148 M409.73 150.88 L415 148 L409.73 145.12" fill="none" stroke="#555" stroke-width="1.5"/><path d="M675 148 L765 148 M759.73 150.88 L765 148 L759.73 145.12" fill="none" stroke="#555" stroke-width="1.5"/><text x="778" y="156" font-size="25" text-anchor="middle" fill="#303030">+</text><path d="M791 148 L905 148 M899.73 150.88 L905 148 L899.73 145.12" fill="none" stroke="#555" stroke-width="1.5"/><text x="930" y="155" font-size="20" text-anchor="middle" fill="#303030">h′</text><text x="355" y="35" font-size="17" text-anchor="middle" fill="#176b71">Timestep embedding e(t)</text><text x="355" y="68" font-size="15" text-anchor="middle" fill="#176b71">Swish → linear projection</text><path d="M355 80 L355 130 M352.12 124.73 L355 130 L357.88 124.73" fill="none" stroke="#176b71" stroke-width="1.5" stroke-dasharray="5 4"/><path d="M45 148 V240 H778 V177" fill="none" stroke="#555" stroke-width="1.5"/><path d="M778 177 L778 165 M780.88 170.27 L778 165 L775.12 170.27" fill="none" stroke="#555" stroke-width="1.5"/><text x="435" y="271" font-size="16" text-anchor="middle" fill="#303030">Residual skip: identity, or channel projection when needed</text></g></svg>
