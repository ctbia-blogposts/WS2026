<svg xmlns="http://www.w3.org/2000/svg" width="480" height="490" viewBox="0 0 480 490" role="img"><title>Inside one DDPM residual block</title><desc>Normalized and activated features pass through a convolution, receive a projected timestep embedding, and pass through normalization, activation, dropout, and a second convolution before a residual skip is added.</desc><rect width="480" height="490" fill="white"/><g font-family="system-ui, sans-serif"><text x="255" y="30" font-size="18" text-anchor="middle" fill="#303030">Input features h</text><rect x="130" y="65" width="250" height="65" fill="none" stroke="#aaa" stroke-width="1"/><text x="255.0" y="89" font-size="16" text-anchor="middle" fill="#303030">GroupNorm → Swish</text><text x="255.0" y="109" font-size="14" text-anchor="middle" fill="#303030">3 × 3 convolution</text><path d="M255 37 L255 65 M252.12 59.73 L255 65 L257.88 59.73" fill="none" stroke="#555" stroke-width="1.5"/><text x="255" y="185" font-size="25" text-anchor="middle" fill="#303030">+</text><path d="M255 130 L255 160 M252.12 154.73 L255 160 L257.88 154.73" fill="none" stroke="#555" stroke-width="1.5"/><text x="70" y="150" font-size="15" text-anchor="middle" fill="#176b71">Project e(t)</text><path d="M30 177 L235 177 M229.73 179.88 L235 177 L229.73 174.12" fill="none" stroke="#176b71" stroke-width="1.5" stroke-dasharray="5 4"/><rect x="130" y="225" width="250" height="85" fill="none" stroke="#aaa" stroke-width="1"/><text x="255.0" y="249" font-size="16" text-anchor="middle" fill="#303030">GroupNorm → Swish</text><text x="255.0" y="269" font-size="14" text-anchor="middle" fill="#303030">Dropout</text><text x="255.0" y="289" font-size="14" text-anchor="middle" fill="#303030">3 × 3 convolution</text><path d="M255 193 L255 225 M252.12 219.73 L255 225 L257.88 219.73" fill="none" stroke="#555" stroke-width="1.5"/><path d="M255 310 L255 365 M252.12 359.73 L255 365 L257.88 359.73" fill="none" stroke="#555" stroke-width="1.5"/><text x="255" y="390" font-size="25" text-anchor="middle" fill="#303030">+</text><path d="M255 398 L255 444 M252.12 438.73 L255 444 L257.88 438.73" fill="none" stroke="#555" stroke-width="1.5"/><text x="255" y="470" font-size="18" text-anchor="middle" fill="#303030">Output features h′</text><path d="M255 45 H95 V382 H235" fill="none" stroke="#555" stroke-width="1.5"/><path d="M220 382 L235 382 M229.73 384.88 L235 382 L229.73 379.12" fill="none" stroke="#555" stroke-width="1.5"/><text x="30" y="345" font-size="15" text-anchor="start" fill="#303030">Skip</text></g></svg>
