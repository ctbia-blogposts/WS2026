y="5 4"/><path d="M945 535 L895 535 M900.27 532.12 L895 535 L900.27 537.88" fill="none" stroke="#176b71" stroke-width="1.5" stroke-dasharray="5 4"/><path d="M345 515 L655 515 M649.73 517.88 L655 515 L649.73 512.12" fill="none" stroke="#888" stroke-width="1.5"/><text x="500.0" y="504" font-size="14" text-anchor="middle" fill="#666">concatenate skip features</text><text x="70" y="614" font-size="14" text-anchor="start" fill="#303030">Encoder</text><text x="930" y="614" font-size="14" text-anchor="end" fill="#303030">Decoder</text><path d="M55 575 V630 H500.0 V640" fill="none" stroke="#176b71" stroke-width="1" stroke-dasharray="5 4"/><path d="M500.0 640 L500.0 650 M497.12 644.73 L500.0 650 L502.88 644.73" fill="none" stroke="#176b71" stroke-width="1.5" stroke-dasharray="5 4"/><rect x="380.0" y="650" width="240" height="70" fill="none" stroke="#aaa" stroke-width="1"/><text x="500.0" y="674" font-size="16" text-anchor="middle" fill="#303030">4 × 4 bottleneck</text><text x="500.0" y="694" font-size="14" text-anchor="middle" fill="#303030">Residual → attention → residual</text><path d="M225.0 555 V685 H380.0" fill="none" stroke="#555" stroke-width="1.5"/><path d="M365.0 685 L380.0 685 M374.73 687.88 L380.0 685 L374.73 682.12" fill="none" stroke="#555" stroke-width="1.5"/><path d="M620.0 685 H775.0 V555" fill="none" stroke="#555" stroke-width="1.5"/><path d="M775.0 570 L775.0 555 M777.88 560.27 L775.0 555 L772.12 560.27" fill="none" stroke="#555" stroke-width="1.5"/><text x="500.0" y="752" font-size="13" text-anchor="middle" fill="#666">Stage overview; individual blocks and channels omitted</text></g></svg>
