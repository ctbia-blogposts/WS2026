<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="770" viewBox="0 0 1000 770" role="img"><title>The timestep-conditioned DDPM U-Net</title><desc>CIFAR-10 resolution stages run from 32 by 32 to 4 by 4 and back. Skip features concatenate into decoder blocks. Timestep embeddings condition all residual blocks; attention is used at 16 by 16 and in the middle block. Input and output convolutions are omitted.</desc><rect width="1000" height="770" fill="white"/><g font-family="system-ui, sans-serif"><text x="500.0" y="32" font-size="18" text-anchor="middle" fill="#176b71">t → sinusoidal embedding → MLP</text><text x="500.0" y="57" font-size="15" text-anchor="middle" fill="#176b71">Condition every residual block</text><path d="M500.0 68 V85 H55 V575 M500.0 85 H945 V575" fill="none" stroke="#176b71" stroke-width="1" stroke-dasharray="5 4"/><text x="225.0" y="116" font-size="17" text-anchor="middle" fill="#303030">Noisy image xₜ</text><text x="775.0" y="116" font-size="17" text-anchor="middle" fill="#303030">Predicted noise εθ</text><path d="M225.0 125 L225.0 160 M222.12 154.73 L225.0 160 L227.88 154.73" fill="none" stroke="#555" stroke-width="1.5"/><path d="M775.0 160 L775.0 125 M777.88 130.27 L775.0 125 L772.12 130.27" fill="none" stroke="#555" stroke-width="1.5"/><rect x="105" y="165" width="240" height="75" fill="none" stroke="#aaa" stroke-width="1"/><text x="225.0" y="189" font-size="16" text-anchor="middle" fill="#303030">32 × 32</text><text x="225.0" y="209" font-size="14" text-anchor="middle" fill="#303030">Residual blocks</text><rect x="655" y="165" width="240" height="75" fill="none" stroke="#aaa" stroke-width="1"/><text x="775.0" y="189" font-size="16" text-anchor="middle" fill="#303030">32 × 32</text><text x="775.0" y="209" font-size="14" text-anchor="middle" fill="#303030">Residual blocks</text><path d="M55 220 L105 220 M99.73 222.88 L105 220 L99.73 217.12" fill="none" stroke="#176b71" stroke-width="1.5" stroke-dasharray="5 4"/><path d="M945 220 L895 22