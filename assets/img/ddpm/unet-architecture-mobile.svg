<svg xmlns="http://www.w3.org/2000/svg" width="480" height="770" viewBox="0 0 480 770" role="img"><title>The timestep-conditioned DDPM U-Net</title><desc>CIFAR-10 resolution stages run from 32 by 32 to 4 by 4 and back. Skip features concatenate into decoder blocks. Timestep embeddings condition all residual blocks; attention is used at 16 by 16 and in the middle block. Input and output convolutions are omitted.</desc><rect width="480" height="770" fill="white"/><g font-family="system-ui, sans-serif"><text x="240.0" y="32" font-size="18" text-anchor="middle" fill="#176b71">t → sinusoidal embedding → MLP</text><text x="240.0" y="57" font-size="15" text-anchor="middle" fill="#176b71">Condition every residual block</text><path d="M240.0 68 V85 H10 V575 M240.0 85 H470 V575" fill="none" stroke="#176b71" stroke-width="1" stroke-dasharray="5 4"/><text x="107.5" y="116" font-size="17" text-anchor="middle" fill="#303030">Noisy image xₜ</text><text x="372.5" y="116" font-size="17" text-anchor="middle" fill="#303030">Predicted noise εθ</text><path d="M107.5 125 L107.5 160 M104.62 154.73 L107.5 160 L110.38 154.73" fill="none" stroke="#555" stroke-width="1.5"/><path d="M372.5 160 L372.5 125 M375.38 130.27 L372.5 125 L369.62 130.27" fill="none" stroke="#555" stroke-width="1.5"/><rect x="20" y="165" width="175" height="75" fill="none" stroke="#aaa" stroke-width="1"/><text x="107.5" y="189" font-size="16" text-anchor="middle" fill="#303030">32 × 32</text><text x="107.5" y="209" font-size="14" text-anchor="middle" fill="#303030">Residual blocks</text><rect x="285" y="165" width="175" height="75" fill="none" stroke="#aaa" stroke-width="1"/><text x="372.5" y="189" font-size="16" text-anchor="middle" fill="#303030">32 × 32</text><text x="372.5" y="209" font-size="14" text-anchor="middle" fill="#303030">Residual blocks</text><path d="M10 220 L20 220 M14.73 222.88 L20 220 L14.73 217.12" fill="none" stroke="#176b71" stroke-width="1.5" stroke-dasharray="5 4"/><path d="M470 220 L460 220 M465